# Bun runtime configuration for Gordon CLI.
#
# `preload` runs before any application code — see
# src/tui/ink-custom/buildCompilerPlugin.ts for what it does. The
# preload module is a no-op unless GORDON_REACT_COMPILER=1, so leaving
# this entry in by default has no effect on normal builds.
preload = ["./src/tui/ink-custom/buildCompilerPlugin.ts"]

[test]
# globalTestReset registers a beforeEach that clears process-global trade/gate
# singletons (WIP registry, cost budget/halt, kill switches, constitution halt)
# so no test inherits dirty state under the shared-process run. Test-isolation
# only — it changes no gate default or logic.
preload = [
  "./src/tui/ink-custom/buildCompilerPlugin.ts",
  "./src/testing/globalTestReset.ts",
]

# Supply-chain defense: refuse to install any npm package version
# released less than 48h ago. Window covers the typical detection
# horizon for community-flagged malicious publishes. Triggered by the
# 2026-05 TanStack worm (42 packages, 84 malicious versions, signed
# SLSA provenance — defenders couldn't tell from the cert alone).
# Mitigation guidance: https://docs.npmjs.com/cli/v11/using-npm/config#min-release-age
# 172800 seconds = 48 hours.
#
# minimumReleaseAgeExcludes: packages exempt from the age gate. We
# only exempt packages that are ALREADY pinned to verified-safe
# versions via package.json overrides — the age gate is redundant
# for them since the pin prevents drift, and excluding them lets
# the lockfile resolve cleanly without waiting on the gate.
[install]
minimumReleaseAge = 172800
minimumReleaseAgeExcludes = [
  "@tanstack/query-core",
  "@tanstack/react-query",
  "@tanstack/react-virtual",
  "@tanstack/virtual-core",
]

# Slot for a security scanner. The repo ships a minimal scanner at
# scripts/security/gordon-security-scanner.cjs that wraps the same
# checks the doctor's `suspicious-optional-deps` and IOC scans
# perform, plus the credential-pattern check from
# scripts/npm/audit-npm-pack-content.cjs. It's warn-only — no
# advisory blocks an install — so opting in is safe.
#
# Enabling requires a small package wrapper (Bun's scanner API expects
# an npm package, not a path). Tracked separately; left commented
# until that wrapper ships. Don't point this at a third-party
# scanner blindly: each scanner runs install-time code against the
# lockfile, which is itself a supply-chain trust decision.
#
# [install.security]
# scanner = "@general-liquidity/gordon-security-scanner"

# Run-time configuration applied to `bun run` / `bun script.ts` invocations.
[run]
# Don't echo the resolved script command (`$ bun --watch run src/index.tsx`)
# above the GORDON banner on `bun run dev` — the banner is the boot identity.
silent = true
# Kill all child processes when Bun exits — including when the parent
# Bun process is SIGKILL'd. Linux/macOS only (no-op on Windows). This
# matters for Gordon because the TUI may spawn long-lived processes
# (MCP servers, broker subscriptions) that should not outlive the
# CLI session. Without this, a force-quit of the TUI can leave
# orphaned subscriptions consuming exchange API quota.
noOrphans = true
