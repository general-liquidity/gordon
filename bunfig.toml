# Bun runtime configuration for Gordon CLI.
#
# `preload` runs before any application code — see
# src/tui/ink-custom/buildCompilerPlugin.ts for what it does. The
# preload module is a no-op unless GORDON_REACT_COMPILER=1, so leaving
# this entry in by default has no effect on normal builds.
preload = ["./src/tui/ink-custom/buildCompilerPlugin.ts"]

[test]
preload = ["./src/tui/ink-custom/buildCompilerPlugin.ts"]

# Supply-chain defense: refuse to install any npm package version
# released less than 48h ago. Window covers the typical detection
# horizon for community-flagged malicious publishes. Triggered by the
# 2026-05 TanStack worm (42 packages, 84 malicious versions, signed
# SLSA provenance — defenders couldn't tell from the cert alone).
# Mitigation guidance: https://docs.npmjs.com/cli/v11/using-npm/config#min-release-age
# 172800 seconds = 48 hours.
[install]
minimumReleaseAge = 172800

# Slot for a third-party security scanner (Bun: `bun pm scan` requires
# this section pointing at an npm package that exports a scanner
# object — e.g. @socketsecurity/cli or similar). Left commented out
# pending a deliberate choice of scanner. Don't enable a scanner
# blindly: each scanner runs install-time code against the lockfile,
# which is itself a supply-chain trust decision.
#
# [install.security]
# scanner = "<package-name>"
