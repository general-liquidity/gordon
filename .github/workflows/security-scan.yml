name: Security Scan

# Pre-launch verification layer. Three legs:
#   secret-scan — HARD gate. A committed exchange/broker/LLM key is catastrophic
#                 for a money-handling agent, so any gitleaks finding fails the
#                 build. False positives are silenced in .gitleaks.toml, never by
#                 disabling the gate.
#   sast        — Semgrep. DIFF-AWARE HARD GATE on pull requests and pushes;
#                 only findings introduced since the relevant base commit fail.
#   deps-osv    — checksummed osv-scanner over bun.lock, hard-gated outside the
#                 narrow, expiring exception in osv-scanner.toml. Socket.dev is
#                 a GitHub App, not a
#                 workflow step — install github.com/apps/socket-security to get
#                 supply-chain PR review; nothing to wire here.
#
# Gitleaks runs as a fixed release binary whose archive digest is committed in
# this workflow. The GitHub Action requires a paid organization license; the
# upstream CLI does not.

on:
  pull_request:
  push:
    branches:
      - main
      - v*

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so a secret committed in ANY past commit is caught,
          # not just the PR tip.
          fetch-depth: 0

      - name: gitleaks (hard gate)
        # The committed .gitleaks-baseline.json accepts the 67 known-benign
        # historic findings (env-var NAMES, test fixtures, the npm-pack
        # detector's own samples, the publishable Supabase anon key). Any NEW
        # secret in a future commit has a different fingerprint and fails here.
        # Regenerate the baseline only after manually confirming a new finding
        # is benign: gitleaks git . --config .gitleaks.toml --redact \
        #   --report-path .gitleaks-baseline.json --report-format json
        run: |
          set -euo pipefail
          archive="gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks git . --config .gitleaks.toml \
            --baseline-path .gitleaks-baseline.json \
            --redact --verbose --exit-code 1

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so the scanner can compare against the relevant base
          # commit on pull requests and protected-branch pushes.
          fetch-depth: 0

      - name: Fetch pull-request base
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}" --depth=1

      - name: Semgrep — diff-aware hard gate
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            baseline="origin/${BASE_REF}"
          elif git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            baseline="${BEFORE_SHA}"
          else
            baseline="HEAD^"
          fi
          docker run --rm \
            -v "${{ github.workspace }}:/src" -w /src \
            semgrep/semgrep@sha256:b94b53d02fd4a022f9eac4e2af1380f5c3c4c21400e79d3336bdff1d1db5e796 \
            semgrep scan \
            --baseline-commit "$baseline" \
            --config p/typescript \
            --config p/javascript \
            --config p/secrets \
            --config p/security-audit \
            --config p/command-injection \
            --config p/trailofbits \
            --sarif --output semgrep.sarif \
            --metrics off --error

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          if-no-files-found: warn

  deps-osv:
    name: Dependency Scan (osv-scanner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install & run osv-scanner
        run: |
          set -euo pipefail
          curl -fsSLo osv-scanner \
            https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          echo "f9f25499a2c8cc367b3af45df2ea7eeca7fbccceab9c35079968f4b3652194be  osv-scanner" \
            | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source \
            --lockfile bun.lock \
            --config osv-scanner.toml
