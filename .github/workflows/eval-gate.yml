name: eval-gate

# Blocks a PR when the eval harness regresses. Deterministic legs run with no
# API keys: the eval unit suite, the structural suite check, the committed-
# fixture coverage check, and the gold-trace process checks (against the
# committed src/infra/domain/evals/fixtures/gold-traces.json by default).
# The optional LLM-judge regression leg is key-gated — see "Eval gate" below.
on:
  pull_request:
    paths:
      - "src/infra/domain/evals/**"
      - "src/infra/safety/**"
      - "src/runtime/permissions/**"
      - "src/core/execution/**"
      - "src/gateway/**"
      - "src/infra/trading/**"
      - "src/infra/agents/prompt-sections/**"
      - "src/infra/agents/tools/**"
      - "src/app/**"
      - "scripts/dev/eval/eval-gate.ts"
      - "scripts/dev/eval/eval-live-runner.ts"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun tsc --noEmit -p tsconfig.json

      # Leg 1: eval unit suite (generator, judge, process checks, drift guard).
      - name: Eval unit suite
        run: bun test src/infra/domain/evals

      # Structural + committed-fixture coverage + gold-trace process checks.
      # All deterministic, no API keys: the gold-trace leg runs against the
      # committed src/infra/domain/evals/fixtures/gold-traces.json unless
      # GORDON_EVAL_GOLD_TRACES overrides it (paper-mode captures; a set but
      # missing path FAILS the gate). Blocks merge on non-zero exit.
      #
      # This PR-facing job is deliberately deterministic and receives no model
      # credentials. The opt-in judged leg is isolated in the manual-only job
      # below, so an untrusted pull request cannot cause secret-bearing code to
      # execute.
      - name: Deterministic eval gate
        run: bun run scripts/dev/eval/eval-gate.ts
        env:
          GORDON_EVAL_GOLD_TRACES: ${{ vars.GORDON_EVAL_GOLD_TRACES }}

      - name: Eval live runner dry-run (Phase 4)
        run: GORDON_EVAL_DRY_RUN=1 bun run scripts/dev/eval/eval-live-runner.ts --k 1

  judged-eval:
    name: Judged eval (manual, trusted inputs only)
    if: github.event_name == 'workflow_dispatch' && vars.GORDON_EVAL_CANDIDATE != ''
    needs: eval-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run opt-in judged regression gate
        run: bun run scripts/dev/eval/eval-gate.ts
        env:
          GORDON_EVAL_GOLD_TRACES: ${{ vars.GORDON_EVAL_GOLD_TRACES }}
          GORDON_EVAL_BASELINE: ${{ vars.GORDON_EVAL_BASELINE }}
          GORDON_EVAL_CANDIDATE: ${{ vars.GORDON_EVAL_CANDIDATE }}
          DEDALUS_API_KEY: ${{ secrets.DEDALUS_API_KEY }}
