name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DIST_REPO: general-liquidity/gordon-cli-dist

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Patch Bun-incompatible dependencies
        run: node scripts/patch-mastra.cjs

      - name: Run tests
        run: bun test

      - name: Run broker conformance matrix
        run: bun run test:broker-conformance

      - name: Run broker latency quality gate
        run: bun run quality:brokers

      - name: Run typecheck
        run: bun run typecheck

  verify-npm-wrapper:
    name: Verify npm Wrapper (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      GORDON_NPM_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare npm wrapper
        run: npm run prepare:npm-wrapper

      - name: Check npm wrapper
        run: npm run check:npm-wrapper

      - name: Smoke test npm wrapper
        run: npm run smoke:npm-wrapper

      - name: Audit npm pack contents (no source files, no .map)
        run: node scripts/audit-npm-pack.cjs

      - name: Source map guardrail (block sourcemap leak)
        run: node scripts/check-no-sourcemaps.cjs

  verify-public-dist:
    name: Verify Public Dist Bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public dist bundle
        run: node scripts/prepare-public-dist.cjs --out-dir .public-dist

      - name: Verify public dist bundle
        run: |
          test -f .public-dist/README.md
          test -f .public-dist/install.sh
          test -f .public-dist/install.ps1
          test -f .public-dist/Formula/gordon.rb
          test -f .public-dist/bucket/gordon.json

  create-source-release:
    name: Create Source Release
    needs:
      - test
      - verify-npm-wrapper
      - verify-public-dist
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update public dist release
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          gh release view "${{ github.ref_name }}" --repo "${DIST_REPO}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --repo "${DIST_REPO}" --title "${{ github.ref_name }}" --notes "Public Gordon CLI binaries"

  build:
    name: Build ${{ matrix.target }}
    needs:
      - create-source-release
    runs-on: ${{ matrix.os }}
    # Experimental targets (windows-arm64) are allowed to fail without
    # blocking the rest of the release. Bun's windows-aarch64 cross-compile
    # runtime is still flaky — we've seen incomplete downloads trip CI even
    # though the toolchain itself is fine. Mark the job as best-effort so
    # a Bun CDN hiccup can't block the publish pipeline.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      # Don't cancel siblings if one target fails — let us see which
      # targets are broken in a single CI run instead of game-of-whack-a-mole.
      fail-fast: false
      matrix:
        include:
          # Standard glibc Linux
          - target: linux-x64
            os: ubuntu-latest
            binary_name: gordon-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            binary_name: gordon-linux-arm64
          # Alpine / musl Linux (separate libc — glibc binaries crash on Alpine)
          - target: linux-x64-musl
            os: ubuntu-latest
            binary_name: gordon-linux-x64-musl
          - target: linux-arm64-musl
            os: ubuntu-latest
            binary_name: gordon-linux-arm64-musl
          # macOS
          - target: darwin-x64
            os: macos-latest
            binary_name: gordon-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            binary_name: gordon-darwin-arm64
          # Windows — both architectures
          - target: windows-x64
            os: windows-latest
            binary_name: gordon-windows-x64.exe
          - target: windows-arm64
            os: windows-latest
            binary_name: gordon-windows-arm64.exe
            experimental: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Patch Bun-incompatible dependencies
        run: node scripts/patch-mastra.cjs

      - name: Build binary
        # Simple retry loop — Bun's cross-compile runtime download is
        # occasionally truncated on windows-arm64, and the fix is just to
        # try again. Up to 3 attempts with a short backoff.
        shell: bash
        run: |
          set -e
          attempt=1
          max=3
          until bun build --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.binary_name }} \
            --external @lightprotocol/compressed-token \
            --external @lightprotocol/stateless.js \
            --external @solana-developers/helpers \
            --external @galacticcouncil/api-augment/hydradx \
            --external @galacticcouncil/api-augment/basilisk \
            src/entry.ts; do
            if [ $attempt -ge $max ]; then
              echo "Build failed after $attempt attempts"
              exit 1
            fi
            echo "Build attempt $attempt failed, retrying..."
            attempt=$((attempt + 1))
            sleep 10
          done

      - name: Upload binary to public dist release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          & gh release upload "${env:GITHUB_REF_NAME}" "${{ matrix.binary_name }}#${{ matrix.binary_name }}" --repo "${env:DIST_REPO}" --clobber

  publish-public-dist:
    name: Publish Public Dist Repo
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download public release assets
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          mkdir -p dist-assets
          gh release download "${VERSION}" \
            --repo "${DIST_REPO}" \
            --dir dist-assets \
            --pattern "gordon-*"

      - name: Compute hashes and update manifests
        run: |
          VERSION_NUMBER="${VERSION#v}"
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"

          sha256sum dist-assets/gordon-darwin-arm64 | awk '{print $1}' > dist-assets/gordon-darwin-arm64.sha256
          sha256sum dist-assets/gordon-darwin-x64 | awk '{print $1}' > dist-assets/gordon-darwin-x64.sha256
          sha256sum dist-assets/gordon-linux-arm64 | awk '{print $1}' > dist-assets/gordon-linux-arm64.sha256
          sha256sum dist-assets/gordon-linux-x64 | awk '{print $1}' > dist-assets/gordon-linux-x64.sha256
          sha256sum dist-assets/gordon-windows-x64.exe | awk '{print $1}' > dist-assets/gordon-windows-x64.exe.sha256

          DARWIN_ARM64=$(cat dist-assets/gordon-darwin-arm64.sha256)
          DARWIN_X64=$(cat dist-assets/gordon-darwin-x64.sha256)
          LINUX_ARM64=$(cat dist-assets/gordon-linux-arm64.sha256)
          LINUX_X64=$(cat dist-assets/gordon-linux-x64.sha256)
          WINDOWS_X64=$(cat dist-assets/gordon-windows-x64.exe.sha256)

          sed -i "s/version \".*\"/version \"${VERSION_NUMBER}\"/" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${DARWIN_ARM64}\"/}" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${DARWIN_X64}\"/}" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${LINUX_ARM64}\"/}" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${LINUX_X64}\"/}" Formula/gordon.rb

          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION_NUMBER}\"/" scripts/scoop/gordon.json
          sed -i "s/\"hash\": \"[^\"]*\"/\"hash\": \"${WINDOWS_X64}\"/" scripts/scoop/gordon.json
          sed -i "s|/v[0-9.]*[^/]*/gordon-windows|/v${VERSION_NUMBER}/gordon-windows|g" scripts/scoop/gordon.json

      - name: Prepare npm wrapper metadata
        env:
          GORDON_NPM_VERSION: ${{ github.ref_name }}
        run: npm run prepare:npm-wrapper

      - name: Resolve source branch
        run: |
          SOURCE_BRANCH=$(git branch -r --contains "${GITHUB_SHA}" | grep -v HEAD | sed 's|origin/||' | grep '^v' | head -1 | xargs)
          if [ -z "${SOURCE_BRANCH}" ]; then
            SOURCE_BRANCH=$(git branch -r --contains "${GITHUB_SHA}" | grep -v HEAD | sed 's|origin/||' | head -1 | xargs)
          fi
          if [ -z "${SOURCE_BRANCH}" ]; then
            SOURCE_BRANCH="main"
          fi
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> "$GITHUB_ENV"
          git checkout "${SOURCE_BRANCH}"

      - name: Commit source manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gordon.rb scripts/scoop/gordon.json npm/package.json npm/README.md
          git diff --cached --quiet || git commit -m "chore: publish assets for ${VERSION}"
          git push origin "HEAD:${SOURCE_BRANCH}"

      - name: Checkout public dist repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: public-dist

      - name: Prepare public dist repo contents
        run: node scripts/prepare-public-dist.cjs --out-dir public-dist

      - name: Commit public dist repo updates
        working-directory: public-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md LICENSE install.sh install.ps1 Formula/gordon.rb bucket/gordon.json
          git diff --cached --quiet || git commit -m "chore: sync public install assets for ${VERSION}"
          git push origin HEAD:main

  publish-npm:
    name: Publish to npm
    needs: publish-public-dist
    runs-on: ubuntu-latest
    env:
      GORDON_NPM_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure npm for scoped publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Prepare npm wrapper
        run: npm run prepare:npm-wrapper

      - name: Determine npm dist-tag
        id: dist-tag
        run: |
          # Pre-release tags like v0.9.0-friends.1 publish under @friends.
          # Stable tags like v0.9.0 publish under @latest.
          # This keeps friend-only releases out of the default channel so
          # `npm install -g @general-liquidity/gordon-cli` won't pick them up.
          if echo "${{ github.ref_name }}" | grep -qE 'friends|alpha|beta|rc'; then
            echo "tag=friends" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public --tag "${{ steps.dist-tag.outputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
