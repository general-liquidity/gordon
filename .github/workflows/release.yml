name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run broker conformance matrix
        run: bun run test:broker-conformance

      - name: Run broker latency quality gate
        run: bun run quality:brokers

      - name: Run typecheck
        run: bun run typecheck

  verify-npm-wrapper:
    name: Verify npm Wrapper (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      GORDON_NPM_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare npm wrapper
        run: npm run prepare:npm-wrapper

      - name: Check npm wrapper
        run: npm run check:npm-wrapper

      - name: Smoke test npm wrapper
        run: npm run smoke:npm-wrapper

  create-release:
    name: Create Release
    needs:
      - test
      - verify-npm-wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs:
      - test
      - verify-npm-wrapper
      - create-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            binary_name: gordon-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            binary_name: gordon-linux-arm64
          - target: darwin-x64
            os: macos-latest
            binary_name: gordon-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            binary_name: gordon-darwin-arm64
          - target: windows-x64
            os: windows-latest
            binary_name: gordon-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: >
          bun build --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.binary_name }}
          --external @lightprotocol/compressed-token
          --external @lightprotocol/stateless.js
          --external @solana-developers/helpers
          --external @galacticcouncil/api-augment/hydradx
          --external @galacticcouncil/api-augment/basilisk
          src/index.tsx

      - name: Upload binary to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "${{ github.ref_name }}" "${{ matrix.binary_name }}#${{ matrix.binary_name }}"
          --repo "${{ github.repository }}"
          --clobber

  update-manifests:
    name: Update Package Manager Manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout source branch
        id: branch
        run: |
          # Find which branch contains this tag and checkout it (avoids detached HEAD)
          BRANCH=$(git branch -r --contains "${{ github.ref }}" | grep -v HEAD | head -1 | sed 's|origin/||' | xargs)
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          git checkout "$BRANCH"

      - name: Download release assets and compute hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p /tmp/binaries

          # Use gh CLI to download — bypasses CDN caching issues
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir /tmp/binaries \
            --pattern "gordon-*"

          # Compute SHA256 hashes
          cd /tmp/binaries
          for f in gordon-*; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Update Homebrew formula
        run: |
          DARWIN_ARM64=$(cat /tmp/binaries/gordon-darwin-arm64.sha256)
          DARWIN_X64=$(cat /tmp/binaries/gordon-darwin-x64.sha256)
          LINUX_ARM64=$(cat /tmp/binaries/gordon-linux-arm64.sha256)
          LINUX_X64=$(cat /tmp/binaries/gordon-linux-x64.sha256)

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/gordon.rb
          # Replace any existing sha256 hash (64 hex chars) or placeholder
          sed -i "s/sha256 \"[a-fA-F0-9]\{64\}\"/sha256 \"PLACEHOLDER\"/" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${DARWIN_ARM64}/}" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${DARWIN_X64}/}" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${LINUX_ARM64}/}" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${LINUX_X64}/}" Formula/gordon.rb

      - name: Update Scoop manifest
        run: |
          WINDOWS_X64=$(cat /tmp/binaries/gordon-windows-x64.exe.sha256)

          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" scripts/scoop/gordon.json
          # Replace any existing hash or placeholder
          sed -i "s/\"hash\": \"[^\"]*\"/\"hash\": \"${WINDOWS_X64}\"/" scripts/scoop/gordon.json
          sed -i "s|/v[0-9.]*[^/]*/gordon-windows|/v${VERSION}/gordon-windows|g" scripts/scoop/gordon.json

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gordon.rb scripts/scoop/gordon.json
          git diff --cached --quiet || git commit -m "chore: update package manifests for v${VERSION}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    env:
      GORDON_NPM_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure npm for scoped publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Prepare npm wrapper
        run: npm run prepare:npm-wrapper

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
