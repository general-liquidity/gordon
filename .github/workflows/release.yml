name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DIST_REPO: general-liquidity/gordon-cli-dist

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run broker conformance matrix
        run: bun run test:broker-conformance

      - name: Run broker latency quality gate
        run: bun run quality:brokers

      - name: Run typecheck
        run: bun run typecheck

  verify-npm-wrapper:
    name: Verify npm Wrapper (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    env:
      GORDON_NPM_VERSION: ${{ github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare npm wrapper
        run: npm run prepare:npm-wrapper

      - name: Check npm wrapper
        run: npm run check:npm-wrapper

      - name: Smoke test npm wrapper
        run: npm run smoke:npm-wrapper

  verify-public-dist:
    name: Verify Public Dist Bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare public dist bundle
        run: node scripts/prepare-public-dist.cjs --out-dir .public-dist

      - name: Verify public dist bundle
        run: |
          test -f .public-dist/README.md
          test -f .public-dist/install.sh
          test -f .public-dist/install.ps1
          test -f .public-dist/Formula/gordon.rb
          test -f .public-dist/bucket/gordon.json

  create-source-release:
    name: Create Source Release
    needs:
      - test
      - verify-npm-wrapper
      - verify-public-dist
    runs-on: ubuntu-latest
    steps:
      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    needs:
      - create-source-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            binary_name: gordon-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            binary_name: gordon-linux-arm64
          - target: darwin-x64
            os: macos-latest
            binary_name: gordon-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            binary_name: gordon-darwin-arm64
          - target: windows-x64
            os: windows-latest
            binary_name: gordon-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: >
          bun build --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.binary_name }}
          --external @lightprotocol/compressed-token
          --external @lightprotocol/stateless.js
          --external @solana-developers/helpers
          --external @galacticcouncil/api-augment/hydradx
          --external @galacticcouncil/api-augment/basilisk
          src/index.tsx

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}
          if-no-files-found: error

  publish-public-dist:
    name: Publish Public Dist Repo
    needs: build
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout source repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-assets
          merge-multiple: true

      - name: Compute hashes and update manifests
        run: |
          VERSION_NUMBER="${VERSION#v}"
          echo "VERSION_NUMBER=$VERSION_NUMBER" >> "$GITHUB_ENV"

          sha256sum dist-assets/gordon-darwin-arm64 | awk '{print $1}' > dist-assets/gordon-darwin-arm64.sha256
          sha256sum dist-assets/gordon-darwin-x64 | awk '{print $1}' > dist-assets/gordon-darwin-x64.sha256
          sha256sum dist-assets/gordon-linux-arm64 | awk '{print $1}' > dist-assets/gordon-linux-arm64.sha256
          sha256sum dist-assets/gordon-linux-x64 | awk '{print $1}' > dist-assets/gordon-linux-x64.sha256
          sha256sum dist-assets/gordon-windows-x64.exe | awk '{print $1}' > dist-assets/gordon-windows-x64.exe.sha256

          DARWIN_ARM64=$(cat dist-assets/gordon-darwin-arm64.sha256)
          DARWIN_X64=$(cat dist-assets/gordon-darwin-x64.sha256)
          LINUX_ARM64=$(cat dist-assets/gordon-linux-arm64.sha256)
          LINUX_X64=$(cat dist-assets/gordon-linux-x64.sha256)
          WINDOWS_X64=$(cat dist-assets/gordon-windows-x64.exe.sha256)

          sed -i "s/version \".*\"/version \"${VERSION_NUMBER}\"/" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${DARWIN_ARM64}\"/}" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${DARWIN_X64}\"/}" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${LINUX_ARM64}\"/}" Formula/gordon.rb
          sed -i "0,/sha256 \"[^\"]*\"/{s//sha256 \"${LINUX_X64}\"/}" Formula/gordon.rb

          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION_NUMBER}\"/" scripts/scoop/gordon.json
          sed -i "s/\"hash\": \"[^\"]*\"/\"hash\": \"${WINDOWS_X64}\"/" scripts/scoop/gordon.json
          sed -i "s|/v[0-9.]*[^/]*/gordon-windows|/v${VERSION_NUMBER}/gordon-windows|g" scripts/scoop/gordon.json

      - name: Prepare npm wrapper metadata
        env:
          GORDON_NPM_VERSION: ${{ github.ref_name }}
        run: npm run prepare:npm-wrapper

      - name: Resolve source branch
        run: |
          SOURCE_BRANCH=$(git branch -r --contains "${GITHUB_SHA}" | grep -v HEAD | sed 's|origin/||' | grep '^v' | head -1 | xargs)
          if [ -z "${SOURCE_BRANCH}" ]; then
            SOURCE_BRANCH=$(git branch -r --contains "${GITHUB_SHA}" | grep -v HEAD | sed 's|origin/||' | head -1 | xargs)
          fi
          if [ -z "${SOURCE_BRANCH}" ]; then
            SOURCE_BRANCH="main"
          fi
          echo "SOURCE_BRANCH=${SOURCE_BRANCH}" >> "$GITHUB_ENV"
          git checkout "${SOURCE_BRANCH}"

      - name: Commit source manifest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gordon.rb scripts/scoop/gordon.json npm/package.json npm/README.md
          git diff --cached --quiet || git commit -m "chore: publish assets for ${VERSION}"
          git push origin "HEAD:${SOURCE_BRANCH}"

      - name: Checkout public dist repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DIST_REPO }}
          token: ${{ secrets.DIST_REPO_TOKEN }}
          path: public-dist

      - name: Prepare public dist repo contents
        run: node scripts/prepare-public-dist.cjs --out-dir public-dist

      - name: Commit public dist repo updates
        working-directory: public-dist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md LICENSE install.sh install.ps1 Formula/gordon.rb bucket/gordon.json
          git diff --cached --quiet || git commit -m "chore: sync public install assets for ${VERSION}"
          git push origin HEAD:main

      - name: Create or update public dist release
        env:
          GH_TOKEN: ${{ secrets.DIST_REPO_TOKEN }}
        run: |
          gh release view "${VERSION}" --repo "${DIST_REPO}" >/dev/null 2>&1 \
            || gh release create "${VERSION}" --repo "${DIST_REPO}" --title "${VERSION}" --notes "Public Gordon CLI binaries"
          gh release upload "${VERSION}" dist-assets/gordon-* --repo "${DIST_REPO}" --clobber

  publish-npm:
    name: Publish to npm
    needs: publish-public-dist
    runs-on: ubuntu-latest
    env:
      GORDON_NPM_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure npm for scoped publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Prepare npm wrapper
        run: npm run prepare:npm-wrapper

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
