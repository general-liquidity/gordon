name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Run tests
        run: bun test

      - name: Run typecheck
        run: bun run typecheck

  build:
    name: Build ${{ matrix.target }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            binary_name: gordon-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            binary_name: gordon-linux-arm64
          - target: darwin-x64
            os: macos-latest
            binary_name: gordon-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            binary_name: gordon-darwin-arm64
          - target: windows-x64
            os: windows-latest
            binary_name: gordon-windows-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: >
          bun build --compile --target=bun-${{ matrix.target }} --outfile=${{ matrix.binary_name }}
          --external @lightprotocol/compressed-token
          --external @lightprotocol/stateless.js
          --external @solana-developers/helpers
          src/index.tsx

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: ${{ matrix.binary_name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec mv {} release/ \;
          ls -la release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-manifests:
    name: Update Package Manager Manifests
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout source branch
        id: branch
        run: |
          # Find which branch contains this tag and checkout it (avoids detached HEAD)
          BRANCH=$(git branch -r --contains "${{ github.ref }}" | grep -v HEAD | head -1 | sed 's|origin/||' | xargs)
          echo "name=$BRANCH" >> $GITHUB_OUTPUT
          git checkout "$BRANCH"

      - name: Download release assets and compute hashes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p /tmp/binaries

          # Use gh CLI to download — bypasses CDN caching issues
          gh release download "v${VERSION}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir /tmp/binaries \
            --pattern "gordon-*"

          # Compute SHA256 hashes
          cd /tmp/binaries
          for f in gordon-*; do
            sha256sum "$f" | awk '{print $1}' > "${f}.sha256"
          done

      - name: Update Homebrew formula
        run: |
          DARWIN_ARM64=$(cat /tmp/binaries/gordon-darwin-arm64.sha256)
          DARWIN_X64=$(cat /tmp/binaries/gordon-darwin-x64.sha256)
          LINUX_ARM64=$(cat /tmp/binaries/gordon-linux-arm64.sha256)
          LINUX_X64=$(cat /tmp/binaries/gordon-linux-x64.sha256)

          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/gordon.rb
          # Replace any existing sha256 hash (64 hex chars) or placeholder
          sed -i "s/sha256 \"[a-fA-F0-9]\{64\}\"/sha256 \"PLACEHOLDER\"/" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${DARWIN_ARM64}/}" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${DARWIN_X64}/}" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${LINUX_ARM64}/}" Formula/gordon.rb
          sed -i "0,/PLACEHOLDER/{s/PLACEHOLDER/${LINUX_X64}/}" Formula/gordon.rb

      - name: Update Scoop manifest
        run: |
          WINDOWS_X64=$(cat /tmp/binaries/gordon-windows-x64.exe.sha256)

          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" scripts/scoop/gordon.json
          # Replace any existing hash or placeholder
          sed -i "s/\"hash\": \"[^\"]*\"/\"hash\": \"${WINDOWS_X64}\"/" scripts/scoop/gordon.json
          sed -i "s|/v[0-9.]*[^/]*/gordon-windows|/v${VERSION}/gordon-windows|g" scripts/scoop/gordon.json

      - name: Commit updated manifests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/gordon.rb scripts/scoop/gordon.json
          git diff --cached --quiet || git commit -m "chore: update package manifests for v${VERSION}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        run: bun install

      - name: Configure npm for scoped publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Update package.json for publish
        run: |
          bun -e "
            const pkg = await Bun.file('package.json').json();
            pkg.name = '@general-liquidity/gordon-cli';
            pkg.private = false;
            await Bun.write('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
